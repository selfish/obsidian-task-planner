version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    # Obsidian owns these exact peer versions; update them with the SDK.
    ignore:
      - dependency-name: "@codemirror/state"
      - dependency-name: "@codemirror/view"
      # >=6.10.3 requires state >=6.6; the Obsidian SDK still requires 6.5.0.
      # Revisit alongside the SDK peer pins, rather than overriding host types.
      - dependency-name: "@codemirror/commands"
        versions: [">=6.10.3"]
    groups:
      runtime:
        patterns:
          - "*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      tooling:
        patterns:
          - "*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
