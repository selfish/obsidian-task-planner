name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch (handles push+PR duplicate triggers)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: 📝 Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: format
        run: |
          if ! npm run format:check 2>&1 | tee format-output.txt; then
            echo "## ❌ Formatting Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following files need formatting:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat format-output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`npm run format\` to fix these issues." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Formatting Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "All files are properly formatted." >> $GITHUB_STEP_SUMMARY

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        run: |
          if ! npm run lint -- --format stylish 2>&1 | tee lint-output.txt; then
            echo "## ❌ Lint Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ESLint found the following issues:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat lint-output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`npm run lint:fix\` to auto-fix some issues." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Lint Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "No linting issues found." >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        id: typecheck
        run: |
          if ! npm run typecheck 2>&1 | tee typecheck-output.txt; then
            echo "## ❌ TypeScript Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "TypeScript found the following type errors:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`typescript" >> $GITHUB_STEP_SUMMARY
            cat typecheck-output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ TypeScript Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "No type errors found." >> $GITHUB_STEP_SUMMARY

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.REVIEWED_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify coverage configuration
        run: npm run test:coverage:config

      - name: Run focused-core unit coverage (existing gate)
        id: test
        run: |
          if ! JEST_JUNIT_CLASSNAME="{filepath}" npx jest --coverage --reporters=default --reporters=jest-junit 2>&1 | tee test-output.txt; then
            echo "## ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Test output:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -100 test-output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY

      - name: Run whole-source unit coverage
        run: npm run test:coverage:whole -- --runInBand

      - name: Summarize both unit coverage surfaces
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          printf '%s\n' "$REVIEWED_SHA" > coverage/revision.txt
          node -e '
            const fs = require("node:fs");
            let summary = "## Unit coverage\n\nReviewed revision: `" + process.env.REVIEWED_SHA + "`\n\n";
            summary += "Real-Obsidian smoke tests are separate and not included.\n\n";
            summary += "| Surface | Lines | Statements | Branches | Functions |\n| --- | --- | --- | --- | --- |\n";
            for (const surface of ["focused-core", "whole-source"]) {
              const report = JSON.parse(fs.readFileSync(`coverage/${surface}/coverage-summary.json`, "utf8"));
              for (const file of Object.keys(report).filter(file => file !== "total")) {
                if (!fs.existsSync(file)) throw new Error(`Unresolved coverage source: ${file}`);
              }
              const { total } = report;
              const values = ["lines", "statements", "branches", "functions"].map(key => `${total[key].pct}% (${total[key].covered}/${total[key].total})`);
              summary += `| ${surface} | ${values.join(" | ")} |\n`;
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '

      - name: Publish labeled coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ env.REVIEWED_SHA }}
          path: coverage/
          if-no-files-found: error
          retention-days: 7

      - name: Verify midnight refresh across DST boundaries
        env:
          TZ: America/New_York
        run: npx jest --runInBand __tests__/ui/task-side-panel-component.test.tsx __tests__/ui/calendar-rollover.test.tsx

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        continue-on-error: true
        with:
          use_oidc: true
          override_pr: ${{ github.event.pull_request.number }}
          files: ./coverage/focused-core/lcov.info
          disable_search: true
          override_commit: ${{ env.REVIEWED_SHA }}
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          override_pr: ${{ github.event.pull_request.number }}
          files: ./junit.xml
          disable_search: true
          override_commit: ${{ env.REVIEWED_SHA }}
          report_type: test_results
          fail_ci_if_error: false

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: |
          if ! npm run build 2>&1 | tee build-output.txt; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build output:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat build-output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Build Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Report bundle size
        run: |
          MAIN_SIZE=$(wc -c < main.js | tr -d ' ')
          MAIN_SIZE_KB=$(echo "scale=1; $MAIN_SIZE / 1024" | bc)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| main.js | ${MAIN_SIZE_KB} KB |" >> $GITHUB_STEP_SUMMARY
          if [ -f styles.css ]; then
            CSS_SIZE=$(wc -c < styles.css | tr -d ' ')
            CSS_SIZE_KB=$(echo "scale=1; $CSS_SIZE / 1024" | bc)
            echo "| styles.css | ${CSS_SIZE_KB} KB |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 7

  audit:
    name: 🔐 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

  e2e:
    name: 🧪 Real Obsidian (${{ matrix.obsidian }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obsidian: '1.13.4'
            installer: '1.5.8'
          - obsidian: '1.13.7'
            installer: '1.5.8'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.REVIEWED_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache verified Obsidian archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-downloads
          key: obsidian-archives-${{ runner.os }}-${{ matrix.obsidian }}-${{ matrix.installer }}-${{ hashFiles('test/e2e/runtime-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run real-Obsidian smoke suite
        env:
          OBSIDIAN_VERSION: ${{ matrix.obsidian }}
          OBSIDIAN_INSTALLER_VERSION: ${{ matrix.installer }}
        run: npm run test:e2e

      - name: Publish calendar regression evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-${{ matrix.obsidian }}-${{ env.REVIEWED_SHA }}
          path: artifacts/calendar-${{ matrix.obsidian }}/
          if-no-files-found: error
          retention-days: 7

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-failure-${{ matrix.obsidian }}
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 7

  # Gate job for branch protection - require this single check
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test, build, audit, e2e]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.audit.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "## ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Format | ${{ needs.format.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| TypeScript | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Dependency Audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Real Obsidian E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ All CI Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Real Obsidian E2E | ✅ |" >> $GITHUB_STEP_SUMMARY
